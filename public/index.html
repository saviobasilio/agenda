<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Semanal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <div>
        <h1>Agenda</h1>
        <p>Organize sua semana e mês em um só lugar.</p>
      </div>
      <div class="view-toggle">
        <button data-view="weekly" class="active">Visualização semanal</button>
        <button data-view="monthly">Visualização mensal</button>
      </div>
    </header>

    <main>
      <section id="weekly-view" class="panel visible">
        <h2>Semana atual</h2>
        <div id="weekly-grid" class="weekly-grid" aria-label="Grade semanal"></div>
      </section>

      <section id="monthly-view" class="panel">
        <div class="month-header">
          <button id="prev-month" aria-label="Mês anterior">◀</button>
          <div>
            <h2 id="month-label"></h2>
            <p id="month-range"></p>
          </div>
          <button id="next-month" aria-label="Próximo mês">▶</button>
        </div>
        <div class="calendar-grid" aria-label="Calendário mensal">
          <div class="calendar-day header">Dom</div>
          <div class="calendar-day header">Seg</div>
          <div class="calendar-day header">Ter</div>
          <div class="calendar-day header">Qua</div>
          <div class="calendar-day header">Qui</div>
          <div class="calendar-day header">Sex</div>
          <div class="calendar-day header">Sáb</div>
          <div id="calendar-days" class="calendar-days"></div>
        </div>
      </section>
    </main>

    <template id="hour-cell-template">
      <div class="hour-cell">
        <label class="sr-only"></label>
        <textarea rows="1" placeholder="Atividade" aria-label=""></textarea>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
